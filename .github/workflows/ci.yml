name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Rezui.slnx
      - run: dotnet build Rezui.slnx --configuration Release --no-restore
      - run: dotnet test Rezui.slnx --configuration Release --no-build
